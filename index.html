<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herr Anwalt: Wolkenkratzer Run (Mobile)</title>
    <style>
        body {
            margin: 0; padding: 0; background: #111; color: #fff;
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column;

            overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
        }
        #gameContainer { position: relative; width: 100vw; max-width: 800px; background: #111; }
        canvas { background: #1e272e; display: block; width: 100%; height: auto; border: 3px solid #34495e; }
        #ui { position: absolute; top: 10px; left: 10px; font-weight: bold; text-shadow: 2px 2px 0 #000; font-size: 16px; pointer-events: none; }
        
        /* Touch Buttons für Handys */
        #controls {
            display: flex; justify-content: space-between; width: 100%;
            max-width: 800px; padding: 12px; box-sizing: border-box; background: #222;
        }
        .d-pad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 6px; }
        .btn-touch {
            background: #34495e; color: white; border: none; border-radius: 12px;
            font-size: 22px; font-weight: bold; display: flex; align-items: center;
            justify-content: center; active-background: #2c3e50;
        }
        .btn-touch:active { background: #2ecc71; }
        .btn-action { background: #e74c3c; width: 120px; height: 126px; font-size: 14px; border-radius: 15px; }
        .btn-action:active { background: #c0392b; }
    </style>
</head>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
