<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Handy Jump</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            /* Verhindert unabsichtliches Zoomen oder Markieren auf dem Handy */
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        #score {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            position: absolute;
            top: 20px;
        }
        canvas {
            background: #333;
            border-top: 4px solid #fff;
            border-bottom: 4px solid #fff;
            width: 100%;
            max-height: 70vh;
        }
        #hint {
            position: absolute;
            bottom: 30px;
            color: #888;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="hint">Tippe auf den Bildschirm zum Springen</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreElement = document.getElementById("score");

const player = {
    x: 60,
    y: 280,
    width: 45,
    height: 45,
    color: "#0095DD",
    gravity: 0.6,
    lift: -13,
    velocity: 0,
    isJumping: false
};

let obstacles = [];
let spawnTimer = 0;
let score = 0;
let gameOver = false;
let gameSpeed = 5.5;

// Touch-Steuerung für das Handy (und Mausklick für PC)
function handleJump() {
    if (!player.isJumping && !gameOver) {
        player.velocity = player.lift;
        player.isJumping = true;
    }
    if (gameOver) {
        resetGame();
    }
}

window.addEventListener("touchstart", (e) => {
    e.preventDefault(); // Verhindert doppelte Events
    handleJump();
}, { passive: false });

window.addEventListener("mousedown", handleJump);

function spawnObstacle() {
    let size = Math.floor(Math.random() * 25) + 25;
    obstacles.push({
        x: canvas.width,
        y: canvas.height - size - 20,
        width: size,
        height: size,
        color: "#FF4136",
        passed: false
    });
}

function resetGame() {
    obstacles = [];
    score = 0;
    gameSpeed = 5.5;
    player.y = 280;
    player.velocity = 0;
    player.isJumping = false;
    gameOver = false;
    scoreElement.innerText = "Score: 0";
    gameLoop();
}

function update() {
    if (gameOver) return;

    player.velocity += player.gravity;
    player.y += player.velocity;

    const groundY = canvas.height - player.height - 20;
    if (player.y > groundY) {
        player.y = groundY;
        player.velocity = 0;
        player.isJumping = false;
    }

    spawnTimer++;
    if (spawnTimer % 85 === 0) {
        spawnObstacle();
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;

        if (
            player.x < obstacles[i].x + obstacles[i].width &&
            player.x + player.width > obstacles[i].x &&
            player.y < obstacles[i].y + obstacles[i].height &&
            player.y + player.height > obstacles[i].y
        ) {
            gameOver = true;
        }

        if (obstacles[i].x + obstacles[i].width < player.x && !obstacles[i].passed) {
            obstacles[i].passed = true;
            score++;
            scoreElement.innerText = "Score: " + score;
            if (score % 5 === 0) {
                gameSpeed += 0.6;
            }
        }

        if (obstacles[i].x + obstacles[i].width < 0) {
            obstacles.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Boden
    ctx.fillStyle = "#555";
    ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

    // Spieler
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Hindernisse
    for (let obs of obstacles) {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    }

    if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "20px sans-serif";
        ctx.fillText("Tippen zum Neustarten", canvas.width / 2, canvas.height / 2 + 20);
    }
}

function gameLoop() {
    update();
    draw();
    if (!gameOver) {
        requestAnimationFrame(gameLoop);
    }
}

gameLoop();
</script>
</body>
</html>
