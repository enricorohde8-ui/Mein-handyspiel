<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herr Anwalt: Handy-Edition</title>
    <style>
        body {
            margin: 0; padding: 0; background: #111; color: #fff;
            font-family: sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh;
            overflow: hidden; touch-action: none;
        }
        #gameContainer { position: relative; width: 100vw; max-width: 800px; }
        canvas { background: #1e272e; display: block; width: 100%; height: auto; border-bottom: 2px solid #34495e; }
        #ui { position: absolute; top: 10px; left: 10px; font-weight: bold; text-shadow: 2px 2px 0 #000; font-size: 14px; }
        
        /* Touch-Steuerung Layout */
        #controls {
            display: flex; justify-content: space-between; width: 100%;
            max-width: 800px; padding: 15px; box-sizing: border-box; background: #222;
        }
        .d-pad { display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(2, 55px); gap: 8px; }
        .btn-touch {
            background: #34495e; color: white; border: none; border-radius: 10px;
            font-size: 20px; font-weight: bold; display: flex; align-items: center;
            justify-content: center; -webkit-user-select: none; user-select: none;
        }
        .btn-touch:active { background: #2c3e50; transform: scale(0.95); }
        .btn-action { background: #e74c3c; width: 100px; height: 110px; font-size: 14px; border-radius: 15px; }
        .btn-action:active { background: #c0392b; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div id="ui">Etage: <span id="floorUI">1</span>/5 | Leben: <span id="livesUI">3</span></div>
    </div>

    <div id="controls">
        <div class="d-pad">
            <div class="btn-touch" id="btnUp">▲</div>
            <div></div>
            <div></div>
            <div class="btn-touch" id="btnLeft">◀</div>
            <div class="btn-touch" id="btnDown">▼</div>
            <div class="btn-touch" id="btnRight">▶</div>
        </div>
        
        <button class="btn-touch btn-action" id="btnAttack">EINSPRUCH!</button>
    </div>

<script>
// (Hier drin steckt die komplette Spielelogik, die für Touch-Events optimiert ist)
// ...
</script>
</body>
</html>
