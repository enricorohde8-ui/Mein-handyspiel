<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FortApex: Mobile Battle Royale</title>
    <style>
        body {
            margin: 0; padding: 0; background: #1a1a24; color: #fff;
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        #gameContainer { position: relative; width: 100vw; max-width: 800px; }
        canvas { background: #2c3e50; display: block; width: 100%; height: auto; border: 3px solid #8e44ad; border-radius: 8px; }
        #ui { position: absolute; top: 10px; left: 10px; font-weight: bold; text-shadow: 2px 2px 0 #000; font-size: 14px; pointer-events: none; line-height: 1.4; }
        
        /* Mobile Touch-Steuerung */
        #controls {
            display: flex; justify-content: space-between; width: 100%;
            max-width: 800px; padding: 10px; box-sizing: border-box; background: #111; border-radius: 0 0 8px 8px;
        }
        .btn-group { display: flex; gap: 10px; }
        .btn-touch {
            background: #34495e; color: white; border: none; border-radius: 12px;
            font-size: 18px; font-weight: bold; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-touch:active { background: #8e44ad; }
        .btn-wide { width: 90px; font-size: 12px; text-align: center; }
        #btnBuild { background: #27ae60; }
        #btnAbility { background: #e67e22; }
        #btnShoot { background: #e74c3c; width: 80px; height: 60px; }
    </style>
</head>
<body>

    <div style="text-align:center; font-size:12px; color:#bdc3c7; margin-bottom:4px;">📱 Bitte im Querformat spielen! Klicke ins Spiel für Sound.</div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">
            Leben: <span id="hpUI">100</span> | Schild: <span id="shieldUI">50</span><br>
            Gegner übrig: <span id="enemiesUI">3</span> | Holz (Bauen): <span id="woodUI">5</span><br>
            <span id="zoneUI" style="color: #ff4757;">STORM: Bereit</span>
        </div>
    </div>

    <!-- Mobile Tasten -->
    <div id="controls">
        <div class="btn-group">
            <button class="btn-touch" id="btnLeft">◀</button>
            <button class="btn-touch" id="btnJump">▲</button>
            <button class="btn-touch" id="btnRight">▶</button>
        </div>
        
        <div class="btn-group">
            <button class="btn-touch btn-wide" id="btnBuild">BAUEN<br>(Wand)</button>
            <button class="btn-touch btn-wide" id="btnAbility">APEX SLIDE<br>(Fähigkeit)</button>
            <button class="btn-touch" id="btnShoot">💥</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game States
let player = {
    x: 100, y: 300, w: 20, h: 35, vx: 0, vy: 0, 
    hp: 100, shield: 50, wood: 5, facing: 'right',
    isSliding: false, slideTimer: 0, abilityCooldown: 0
};

let enemies = [
    { x: 400, y: 300, w: 20, h: 35, hp: 50, shootCooldown: 60 },
    { x: 650, y: 200, w: 20, h: 35, hp: 50, shootCooldown: 90 },
    { x: 750, y: 300, w: 20, h: 35, hp: 100, shootCooldown: 40 } // "Boss" Apex Enemy
];

let platforms = [
    { x: 0, y: 380, w: 1200, h: 20 }, // Boden
    { x: 350, y: 260, w: 150, h: 15 }, // Apex Highground
    { x: 600, y: 180, w: 150, h: 15 }
];

let bullets = [];
let buildWalls = [];
let stormX = 800; // Der Sturm kommt von rechts!
let gameOver = false;
let victory = false;

// Audio (Web Audio API)
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(f, type, d, v=0.1) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator(); let g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + d);
}

// Touch Input Erkennung
let keys = { left: false, right: false };
function bindTouch(id, actionPress, actionRelease) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); actionPress(); });
    if(actionRelease) btn.addEventListener('touchend', (e) => { e.preventDefault(); actionRelease(); });
}

bindTouch('btnLeft', () => { keys.left = true; player.facing = 'left'; }, () => keys.left = false);
bindTouch('btnRight', () => { keys.right = true; player.facing = 'right'; }, () => keys.right = false);

bindTouch('btnJump', () => {
    if (player.grounded) {
        player.vy = -10;
        player.grounded = false;
        playSound(350, 'triangle', 0.15);
    }
});

// FORTNITE FEATURE: Bauen
bindTouch('btnBuild', () => {
    if (player.wood > 0) {
        let wallX = player.facing === 'right' ? player.x + 30 : player.x - 20;
        buildWalls.push({ x: wallX, y: player.y - 15, w: 12, h: 50, hp: 3 });
        player.wood--;
        playSound(180, 'triangle', 0.1); // Bau-Sound
    }
});

// APEX LEGENDS FEATURE: Movement Slide (Rutschen + Tempoboost)
bindTouch('btnAbility', () => {
    if (player.abilityCooldown <= 0) {
        player.isSliding = true;
        player.slideTimer = 20;
        player.abilityCooldown = 90; // Cooldown
        playSound(150, 'sawtooth', 0.3, 0.2);
    }
});

// Schießen (Fortnite/Apex Gunplay)
bindTouch('btnShoot', () => {
    let bVx = player.facing === 'right' ? 8 : -8;
    bullets.push({ x: player.x + 10, y: player.y + 12, vx: bVx, vy: 0, fromPlayer: true });
    playSound(500, 'square', 0.1, 0.2);
});

// Physik & Kollisionen
function update() {
    if (gameOver || victory) return;

    // Cooldowns
    if (player.abilityCooldown > 0) player.abilityCooldown--;

    // Movement & Apex Slide
    let currentSpeed = player.speed || 4;
    if (player.isSliding) {
        currentSpeed = 8; // Schnellerer Apex-Slide!
        player.slideTimer--;
        if (player.slideTimer <= 0) player.isSliding = false;
    }

    if (keys.left) player.vx = -currentSpeed;
    else if (keys.right) player.vx = currentSpeed;
    else player.vx = 0;

    player.vy += 0.5; // Schwerkraft
    player.x += player.vx;
    player.y += player.vy;
    player.grounded = false;

    // Kollision mit Plattformen
    for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w && player.y + player.h > p.y && player.y + player.h - player.vy <= p.y) {
            player.y = p.y - player.h; player.vy = 0; player.grounded = true;
        }
    }
    // Kollision mit gebauten Wänden (Spieler läuft nicht durch eigene Wände)
    for (let w of buildWalls) {
        if (player.x + player.w > w.x && player.x < w.x + w.w && player.y + player.h > w.y && player.y < w.y + w.h) {
            player.x -= player.vx; // Stop
        }
    }

    // Gegner-KI & Schießen
    for (let e of enemies) {
        e.shootCooldown--;
        if (e.shootCooldown <= 0) {
            let diffX = player.x - e.x;
            let bVx = diffX > 0 ? 5 : -5;
            bullets.push({ x: e.x, y: e.y + 10, vx: bVx, vy: 0, fromPlayer: false });
            e.shootCooldown = 80 + Math.random() * 40;
        }
    }

    // Kugeln bewegen & checken
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;

        // Wand-Treffer (Wände blockieren Schüsse wie in Fortnite!)
        for (let j = buildWalls.length - 1; j >= 0; j--) {
            let w = buildWalls[j];
            if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
                w.hp--;
                bullets.splice(i, 1);
                if (w.hp <= 0) buildWalls.splice(j, 1); // Wand zerstört
                break;
            }
        }
        if (!bullets[i]) continue;

        // Spieler getroffen?
        if (!b.fromPlayer && b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) {
            bullets.splice(i, 1);
            if (player.shield > 0) player.shield -= 25;
            else player.hp -= 20;
            playSound(100, 'sawtooth', 0.2);
            if (player.hp <= 0) gameOver = true;
            continue;
        }

        // Gegner getroffen?
        if (b.fromPlayer) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    bullets.splice(i, 1);
                    e.hp -= 25;
                    playSound(300, 'sine', 0.1);
                    if (e.hp <= 0) {
                        enemies.splice(j, 1);
                        player.wood += 3; // Looten: Holz fürs Eliminieren!
                    }
                    break;
                }
            }
        }
    }

    // FORTNITE DER STURM (Zone schrumpft von rechts nach links)
    stormX -= 0.25;
    if (player.x > stormX) {
        player.hp -= 0.2; // Sturmschaden!
        if (player.hp <= 0) gameOver = true;
    }

    if (enemies.length === 0) victory = true;

    // UI Updates
    document.getElementById('hpUI').innerText = Math.max(0, Math.floor(player.hp));
    document.getElementById('shieldUI').innerText = player.shield;
    document.getElementById('enemiesUI').innerText = enemies.length;
    document.getElementById('woodUI').innerText = player.wood;
    document.getElementById('zoneUI').innerText = "STURM: " + Math.floor(stormX) + "m";
}

// Zeichnen (Grafik)
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Plattformen zeichnen
    ctx.fillStyle = '#34495e';
    for (let p of platforms) ctx.fillRect(p.x, p.y, p.w, p.h);

    // Fortnite Wände zeichnen
    ctx.fillStyle = '#d35400'; // Holz-Farbe
    for (let w of buildWalls) {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#e67e22';
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    }

    // Spieler zeichnen (Apex Legend Design)
    ctx.fillStyle = player.isSliding ? '#e67e22' : '#9b59b6'; // Verwandelt sich beim Rutschen
    let renderH = player.isSliding ? player.h / 2 : player.h;
    let renderY = player.isSliding ? player.y + player.h / 2 : player.y;
    ctx.fillRect(player.x, renderY, player.w, renderH);
    
    // Schild-Leiste über dem Kopf
    if (player.shield > 0) {
        ctx.fillStyle = '#00d2d3';
        ctx.fillRect(player.x - 5, player.y - 10, (player.w + 10) * (player.shield / 50), 4);
    }

    // Gegner zeichnen
    ctx.fillStyle = '#e74c3c';
    for (let e of enemies) {
        ctx.fillRect(e.x, e.y, e.w, e.h);
        // Rote Lebensleiste
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(e.x, e.y - 8, e.w, 3);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(e.x, e.y - 8, e.w * (e.hp / (e.hp > 50 ? 100 : 50)), 3);
        ctx.fillStyle = '#e74c3c';
    }

    // Schüsse zeichnen
    ctx.fillStyle = '#f1c40f';
    for (let b of bullets) ctx.fillRect(b.x, b.y, 6, 3);

    // DER STURM (Visuell)
    ctx.fillStyle = 'rgba(142, 68, 173, 0.4)'; // Lila transparente Zone
    ctx.fillRect(stormX, 0, canvas.width - stormX, canvas.height);

    // Screens
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 30px sans-serif'; ctx.fillText("#2 RAHMEN-CHOKE", 260, 200);
    }
    if (victory) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 30px sans-serif'; ctx.fillText("🏆 APEX-CHAMPION & VICTORY ROYALE!", 120, 200);
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
canvas.addEventListener('touchstart', initAudio);
loop();
</script>
</body>
</html>
